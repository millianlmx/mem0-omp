# Le serveur de pipelines en une pile, sans terminal : Portainer (Stacks › Add stack ›
# Repository, l'URL de ce dépôt, ce fichier) ou `docker compose up -d` ici. Au premier
# démarrage, `setup` crée les secrets, la configuration et la clé SSH ; les suivants
# ne font que reprendre les variables ci-dessous. Le détail :
# omp-harness/README.md § « Avec Portainer ».
#
# Variables de la pile, toutes facultatives sauf la clé du modèle :
#   ANTHROPIC_API_KEY (ou OPENROUTER_API_KEY)  la clé des agents
#   GH_TOKEN               un jeton GitHub (issues en MCP, merge gh) : écrit dans le secret du service, jamais donné aux runners
#   OMP_HARNESS_MEMORY_TOKENS    des jetons mémoire limités à des portées, `nom:jeton:scope1,scope2;…` :
#                                mem0-rs les accepte, le service les voit en MEM0_TOKEN_<NOM> (`memory.tokenEnv` d'un dépôt)
#   OMP_HARNESS_GITHUB_ACCOUNTS  des comptes GitHub par dépôt, `nom:jeton;…` : GH_TOKEN_<NOM> du service (`gh.tokenEnv`)
#   OMP_HARNESS_GITLAB_ACCOUNTS  des comptes GitLab par dépôt, `nom:jeton;…` : GITLAB_TOKEN_<NOM> du service (`gitlab.tokenEnv`)
#   OMP_HARNESS_REPOS      les dépôts, séparés par des virgules (git@github.com:toi/dépôt.git)
#   OMP_HARNESS_ROOT       les données, sur l'hôte (/var/lib/omp-harness)
#   OMP_HARNESS_SECRETS    les secrets, sur l'hôte (/var/lib/omp-harness-secrets)
#   OMLX_BASE_URL          un serveur d'embeddings à toi ; sinon l'Ollama de la pile
#   OMLX_CHAT_BASE_URL     le serveur de chat du rêve de la mémoire (OMLX_LLM_MODEL) ;
#                          défaut : OMLX_BASE_URL, coupé (off) avec l'Ollama de la pile
#   OMLX_CHAT_API_TOKEN    sa clé ; défaut : OMLX_API_TOKEN
#   OMP_HARNESS_TAILNET_PORT       le port https du harness sur le tailnet (443)
#   OMP_HARNESS_TAILNET_MEM0_PORT  celui de la mémoire (8443)
#   OMP_HARNESS_TAILSCALE_SERVE=0  ne touche pas au `tailscale serve` de l'hôte
#   OMP_HARNESS_COMMIT     le commit construit, rendu par /v1/health ; sans lui, lu
#                          dans le .git du clone, sinon prouvé par le tag de la version
#                          sur OMP_HARNESS_SOURCE_REPO (Portainer supprime le .git)
#   VIGIE_MODEL            le modèle des sessions de la vigie (fournisseur/modèle ; défaut : celui d'omp)
#
# Le déploiement continu : Portainer suit la branche `deploy` (GitOps updates), que
# le job de release avance sur chaque release du harness.
#
# Tailscale n'est pas dans la pile : celui de l'hôte publie le harness et sa mémoire
# (service `pairing`, par son socket).
#
# Les chemins de données sont montés au MÊME endroit dans le service : il lance ses
# runners et ses jobs de tests en conteneurs frères, qui montent un worktree par son
# chemin sur l'hôte.

x-harness-image: &harness-image
  build:
    context: .
    dockerfile: omp-harness/deploy/container/Dockerfile.harness
    args:
      OMP_HARNESS_COMMIT: ${OMP_HARNESS_COMMIT:-}
      OMP_HARNESS_SOURCE_REPO: ${OMP_HARNESS_SOURCE_REPO-https://github.com/millianlmx/mem0-omp.git}
  image: omp-harness:local
  # Construite depuis le dépôt, jamais tirée d'un registre.
  pull_policy: build

x-paths: &paths
  OMP_HARNESS_ROOT: ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}
  OMP_HARNESS_SECRETS: ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}
  HOME: ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/home

# Les navigateurs Obscura : l'image officielle plus un shell (elle n'en a pas, et Obscura
# ne lit son jeton que dans OBSCURA_CDP_TOKEN).
x-obscura-image: &obscura-image
  build:
    context: .
    dockerfile: omp-harness/deploy/container/Dockerfile.obscura
  image: omp-harness-obscura:local
  pull_policy: build
  restart: unless-stopped
  depends_on:
    setup: { condition: service_completed_successfully }
  environment:
    OBSCURA_NAV_TIMEOUT_MS: "20000"
    OBSCURA_CDP_COMMAND_TIMEOUT_MS: "25000"

services:
  # Une fois par démarrage : dossiers, secrets (le jeton de la mémoire est gardé),
  # config.json, clé SSH. Les autres services l'attendent.
  setup:
    <<: *harness-image
    command: ["omp-harness-stack", "init"]
    restart: "no"
    environment:
      <<: *paths
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      OMP_HARNESS_MEMORY_TOKENS: ${OMP_HARNESS_MEMORY_TOKENS:-}
      OMP_HARNESS_GITHUB_ACCOUNTS: ${OMP_HARNESS_GITHUB_ACCOUNTS:-}
      OMP_HARNESS_GITLAB_ACCOUNTS: ${OMP_HARNESS_GITLAB_ACCOUNTS:-}
      OMLX_BASE_URL: ${OMLX_BASE_URL:-}
      OMLX_API_TOKEN: ${OMLX_API_TOKEN:-}
      OMLX_CHAT_BASE_URL: ${OMLX_CHAT_BASE_URL:-}
      OMLX_CHAT_API_TOKEN: ${OMLX_CHAT_API_TOKEN:-}
      OMLX_LLM_MODEL: ${OMLX_LLM_MODEL:-qwen3-8b}
      OMLX_EMBED_MODEL: ${OMLX_EMBED_MODEL:-bge-m3}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1024}
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}:${OMP_HARNESS_ROOT:-/var/lib/omp-harness}
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}:${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}

  harness:
    <<: *harness-image
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
      runner-image: { condition: service_completed_successfully }
      test-image: { condition: service_completed_successfully }
      mem0: { condition: service_started }
    ports:
      # La boucle locale seulement : le Tailscale de l'hôte l'ouvre au tailnet.
      - "127.0.0.1:${OMP_HARNESS_PORT:-8790}:8790"
    environment:
      <<: *paths
      # Le jeton de la mémoire, rien d'autre : les clés LLM ne sont jamais montées ici.
      OMP_HARNESS_ENV_FILE: /run/secrets/omp-harness/harness.env
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}:${OMP_HARNESS_ROOT:-/var/lib/omp-harness}
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/config.json:/etc/omp-harness/config.json:ro
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/harness:/run/secrets/omp-harness:ro
      - ${OMP_HARNESS_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    # `default` d'abord : sans lui, le service quitterait le réseau des runners.
    networks:
      - default
      - obscura
      - obscura-poste
    # La santé du service (`/v1/health` : base, scheduling, disque ; 503 au moindre
    # échec). L'image a node, pas curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Déclare les dépôts d'OMP_HARNESS_REPOS ; un dépôt refusé est réessayé toutes les
  # 30 s, le temps de poser la clé de déploiement affichée dans ses journaux.
  repos:
    <<: *harness-image
    command: ["omp-harness-stack", "repos"]
    restart: "no"
    depends_on:
      harness: { condition: service_started }
    environment:
      <<: *paths
      OMP_HARNESS_REPOS: ${OMP_HARNESS_REPOS:-}
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}:${OMP_HARNESS_ROOT:-/var/lib/omp-harness}
      - ${OMP_HARNESS_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  # La vigie (omp-harness/vigie/) : 24/24, à part du harness pour survivre à ses pannes et
  # constater son silence. Elle lit le journal structuré et les clones EN LECTURE SEULE,
  # parle au harness sous son jeton de client pilote (créé par `setup`, jamais celui de
  # l'approbateur) et n'a ni le socket du moteur, ni la base, ni le jeton GitHub. Son mode
  # (shadow au départ) se règle par `PUT /v1/vigie`.
  vigie:
    build:
      context: .
      dockerfile: omp-harness/deploy/container/Dockerfile.vigie
    image: omp-harness-vigie:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    environment:
      HOME: /var/lib/omp-vigie/home
      VIGIE_ENV_FILE: /run/secrets/omp-vigie/vigie.env
      VIGIE_HARNESS_URL: http://harness:8790
      VIGIE_STATE_DIR: /var/lib/omp-vigie
      VIGIE_LOGS_DIR: /logs
      VIGIE_REPOS_DIR: /repos
      VIGIE_MODEL: ${VIGIE_MODEL:-}
      MEM0_HTTP_URL: http://mem0:8321
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/vigie:/var/lib/omp-vigie
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/state/logs:/logs:ro
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/repos:/repos:ro
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/vigie:/run/secrets/omp-vigie:ro

  mem0:
    build: mem0-stack/mem0-rs
    image: mem0-rs:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
      setup: { condition: service_completed_successfully }
    # Ses réglages et son jeton, écrits par `setup` : lus au démarrage.
    entrypoint: ["/bin/sh", "-c", "set -a && . /run/secrets/mem0/mem0.env && set +a && exec /usr/local/bin/mem0-rs --host 0.0.0.0 --port 8321"]
    # La copie hors machine de chaque instantané (`sh -c`, chemin en $1) : passée telle
    # quelle, jamais sourcée. L'image n'a que sh et curl (mem0-stack/README.md).
    environment:
      MEM0_BACKUP_REMOTE_CMD: ${MEM0_BACKUP_REMOTE_CMD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OMP_HARNESS_MEM0_PORT:-8321}:8321"
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/mem0:/data
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/mem0:/run/secrets/mem0:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8321/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Les embeddings de la mémoire : un Ollama sur le CPU, et son modèle tiré une fois.
  embeddings:
    image: docker.io/ollama/ollama:0.40.14
    restart: unless-stopped
    environment:
      # Le modèle reste chargé : un rechargement à froid ferait expirer les écritures de mem0.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/ollama:/root/.ollama

  embeddings-model:
    image: docker.io/ollama/ollama:0.40.14
    command: ["pull", "${OMLX_EMBED_MODEL:-bge-m3}"]
    restart: on-failure
    depends_on: [embeddings]
    environment:
      OLLAMA_HOST: http://embeddings:11434

  # Publie le harness (443) et sa mémoire (8443), ou les ports OMP_HARNESS_TAILNET_*,
  # par le Tailscale de l'hôte, puis écrit le code d'appairage dans ses journaux et les
  # deux adresses dans published/ (lues par `omp-harness-stack approver`).
  pairing:
    build:
      context: .
      dockerfile: omp-harness/deploy/container/Dockerfile.pairing
    image: omp-harness-pairing:local
    pull_policy: build
    # Un init en PID 1 : le script attend en boucle, un arrêt le coupe tout de suite.
    init: true
    restart: on-failure
    depends_on: [harness]
    environment:
      OMP_HARNESS_PORT: ${OMP_HARNESS_PORT:-8790}
      OMP_HARNESS_MEM0_PORT: ${OMP_HARNESS_MEM0_PORT:-8321}
      OMP_HARNESS_TAILNET_PORT: ${OMP_HARNESS_TAILNET_PORT:-443}
      OMP_HARNESS_TAILNET_MEM0_PORT: ${OMP_HARNESS_TAILNET_MEM0_PORT:-8443}
      OMP_HARNESS_TAILSCALE_SERVE: ${OMP_HARNESS_TAILSCALE_SERVE:-1}
    volumes:
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/state:/state:ro
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/mem0:/secrets:ro
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/published:/published
      # Le dossier du socket de tailscaled sur l'hôte, pas le socket lui-même : un
      # fichier absent deviendrait un dossier.
      - ${OMP_HARNESS_TAILSCALE_RUN:-/var/run/tailscale}:/var/run/tailscale

  # Les navigateurs Obscura, construits depuis l'image officielle épinglée par digest plus
  # un shell (omp-harness/deploy/container/Dockerfile.obscura). Jamais publiés sur l'hôte :
  # `obscura` (éphémère, sans identité) sert les outils `browser_*` du harness ;
  # `obscura-poste` (stockage persistant) est celui de l'agent corpo, joignable par le seul
  # `harness`. Les jetons CDP sont des fichiers des secrets, écrits par `setup`.
  obscura:
    <<: *obscura-image
    volumes:
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/obscura:/run/secrets/obscura:ro
    networks:
      - obscura
      - obscura-sortie

  obscura-poste:
    <<: *obscura-image
    command: ["--storage-dir", "/var/lib/obscura-poste"]
    volumes:
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/obscura-poste:/run/secrets/obscura:ro
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/obscura-poste/storage:/var/lib/obscura-poste
    networks:
      - obscura-poste
      - obscura-poste-sortie

  # Les images que le service lance à la demande : construites ou tirées avec la
  # pile, puis arrêtées (état « exited » : c'est normal).
  runner-image:
    build:
      context: .
      dockerfile: omp-harness/deploy/container/Dockerfile.runner
    image: omp-harness-runner:local
    pull_policy: build
    restart: "no"

  test-image:
    image: docker.io/library/node:22-bookworm
    command: ["true"]
    restart: "no"

  # Le profil `monitoring`, coupé par défaut : `docker compose --profile monitoring up -d`.
  # Les jetons de scrape sont des fichiers de OMP_HARNESS_SECRETS/monitoring (README du
  # harness § Observabilité) ; Prometheus tourne en root pour lire ces fichiers 0600.
  prometheus:
    image: docker.io/prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    user: "0"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./omp-harness/deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OMP_HARNESS_SECRETS:-/var/lib/omp-harness-secrets}/monitoring:/run/secrets/monitoring:ro
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/prometheus:/prometheus

  grafana:
    image: docker.io/grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on: [prometheus]
    user: "0"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${OMP_HARNESS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./omp-harness/deploy/monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/omp.yml:ro
      - ./omp-harness/deploy/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/omp.yml:ro
      - ./omp-harness/deploy/monitoring/grafana/omp-harness.json:/var/lib/grafana/dashboards/omp-harness.json:ro
      - ${OMP_HARNESS_ROOT:-/var/lib/omp-harness}/grafana:/var/lib/grafana

networks:
  default:
    # Le réseau que rejoignent les runners (`container.network`) : ils y joignent `mem0`.
    name: omp-harness
  # Les navigateurs Obscura (jamais publiés) : chacun a un réseau interne qu'il ne partage
  # qu'avec `harness`, et un réseau de sortie dont il est le seul membre.
  obscura:
    name: omp-obscura
    internal: true
  obscura-sortie:
    name: omp-obscura-sortie
    driver_opts:
      # Nom fixe du pont sur l'hôte : les règles pare-feu du README (« Couper l'hôte du navigateur ») le visent.
      com.docker.network.bridge.name: omp-obs-sortie
  obscura-poste:
    name: omp-obscura-poste
    internal: true
  obscura-poste-sortie:
    name: omp-obscura-poste-sortie
    driver_opts:
      # Idem : le pont du navigateur du poste, visé par les mêmes règles.
      com.docker.network.bridge.name: omp-obsp-sort
