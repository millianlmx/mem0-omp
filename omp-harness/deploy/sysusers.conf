# /etc/sysusers.d/omp-harness.conf — trois users, trois rôles.
#   omp-harness : le service (base, jeton d'API) — seul à lire /var/lib/omp-harness/state
#   omp-runner  : les runners OMP (clés des fournisseurs LLM, worktrees)
#   omp-heavy   : tests et builds (aucune clé, aucun réseau)
#   omp-mem0    : l'oracle mem0-rs (la base de la mémoire du projet)
# omp-work : le groupe des worktrees et des caches, partagé par les trois.
g omp-work -
u omp-harness - "OMP harness - service" /var/lib/omp-harness /usr/sbin/nologin
u omp-runner - "OMP harness - runners" /var/lib/omp-runner /usr/sbin/nologin
u omp-heavy - "OMP harness - jobs heavy" /var/lib/omp-heavy /usr/sbin/nologin
u omp-mem0 - "OMP harness - oracle mem0-rs" /var/lib/omp-mem0 /usr/sbin/nologin
m omp-harness omp-work
m omp-runner omp-work
m omp-heavy omp-work
