# Le harness en conteneurs : le service et sa mémoire. Les runners et les jobs de
# tests ne sont PAS des services : le service les lance à la demande, en conteneurs
# frères, par le socket du moteur. Se pilote par harness.sh, qui écrit les
# variables ci-dessous dans ${OMP_HARNESS_ROOT}/compose.env.
#
# Les chemins sous OMP_HARNESS_ROOT sont montés au MÊME endroit dans le service :
# un conteneur frère monte un worktree par son chemin sur l'hôte.
name: omp-harness

services:
  harness:
    build:
      context: ../../..
      dockerfile: omp-harness/deploy/container/Dockerfile.harness
    image: omp-harness:local
    user: "${OMP_HARNESS_USER}"
    group_add: ["${OMP_HARNESS_ENGINE_GID:-0}"]
    restart: unless-stopped
    depends_on: [mem0]
    ports:
      # Publié sur la boucle locale seulement ; Tailscale (ou un proxy TLS) l'ouvre.
      - "127.0.0.1:${OMP_HARNESS_PORT:-8790}:8790"
    environment:
      HOME: ${OMP_HARNESS_ROOT}/home
    env_file:
      # Le jeton de la mémoire, rien d'autre : les clés LLM ne sont jamais montées ici.
      - ${OMP_HARNESS_SECRETS}/harness.env
    volumes:
      - ${OMP_HARNESS_ROOT}:${OMP_HARNESS_ROOT}
      - ${OMP_HARNESS_ROOT}/config.json:/etc/omp-harness/config.json:ro
      - ${OMP_HARNESS_SOCKET}:/var/run/docker.sock
    # La santé du service (`/v1/health` : base, scheduling, disque ; 503 au moindre
    # échec). L'image a node, pas curl.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mem0:
    build: ../../../mem0-stack/mem0-rs
    image: mem0-rs:local
    restart: unless-stopped
    env_file:
      - ${OMP_HARNESS_SECRETS}/mem0.env
    extra_hosts:
      # L'hôte (oMLX natif sur le Mac, ou un relais local) sous ses deux noms usuels.
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    ports:
      # Pour la mémoire partagée avec le Mac (tailscale serve --https=8443).
      - "127.0.0.1:${OMP_HARNESS_MEM0_PORT:-8321}:8321"
    volumes:
      - ${OMP_HARNESS_ROOT}/mem0:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8321/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Les embeddings de la mémoire quand `harness.sh up` n'en a pas reçu d'autres
  # (OMLX_BASE_URL) : un Ollama sur le CPU, joint par mem0 sur le réseau interne. Il
  # n'a pas de modèle de chat : mem0.env porte alors OMLX_CHAT_BASE_URL=off.
  embeddings:
    image: docker.io/ollama/ollama:0.12.6
    restart: unless-stopped
    profiles: ["embeddings"]
    environment:
      # Le modèle reste chargé : un rechargement à froid ferait expirer les écritures de mem0.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ${OMP_HARNESS_ROOT}/ollama:/root/.ollama

  # L'image des runners : construite avec les autres (`--profile images build`),
  # jamais démarrée comme service.
  runner-image:
    build:
      context: ../../..
      dockerfile: omp-harness/deploy/container/Dockerfile.runner
    image: omp-harness-runner:local
    profiles: ["images"]

networks:
  default:
    # Le réseau que rejoignent les runners (`container.network`) : ils y joignent `mem0`.
    name: omp-harness
