name: release-assets

# Chaque release publiée reçoit les apps OMP Console : le bundle macOS
# (OMP-Console-macOS.zip) et l'app iOS (OMP-Console-iOS.ipa), ainsi que l'extension
# Chrome du poste de travail (omp-chrome.zip, construite par scripts/chrome-extension.sh),
# chacune avec son empreinte .sha256. Quand les secrets de signature existent, l'app Mac est signée
# Developer ID et notarisée, l'IPA signée ; sans eux (fork, ou secrets pas encore
# créés), l'app Mac reste signée ad hoc et l'IPA non signée (PUBLISHING.md § Apps
# jointes aux releases). Les releases sont créées par le job de release avec le
# jeton dédié (RELEASE_TOKEN) : contrairement à celles du GITHUB_TOKEN, elles
# déclenchent ce workflow. `workflow_dispatch` rejoint une release déjà publiée
# (rattrapage, ou un job tombé).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (ex. omp-harness-v1.2.0)"
        required: true

permissions:
  contents: read

# Une construction par release : un rejeu attend le précédent au lieu de téléverser
# en même temps que lui.
concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  app:
    name: app (${{ matrix.app }})
    # L'extension Chrome ne demande que node : un runner Linux suffit, les macOS
    # restent aux deux apps.
    runs-on: ${{ matrix.app == 'chrome' && 'ubuntu-latest' || 'macos-latest' }}
    # Compilation (cargo, SwiftPM ou xcodebuild) puis, pour l'app Mac signée,
    # jusqu'à 30 min d'attente de la notarisation.
    timeout-minutes: 60
    # Seul ce job écrit : `gh release upload` exige contents: write.
    permissions:
      contents: write
    strategy:
      # Les trois fichiers sont indépendants : l'échec de l'un n'annule pas le
      # téléversement des autres.
      fail-fast: false
      matrix:
        app: [mac, ios, chrome]
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le code du tag, jamais celui de main : l'app jointe est celle de la release.
          ref: refs/tags/${{ env.TAG }}
      # scripts/chrome-extension.sh exige node ≥ 22.13 (stripTypeScriptTypes de node:module).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.app == 'chrome'
        with:
          node-version: "22"
      # Les secrets de signature ne vont qu'à cette étape, et chacun au seul job de
      # son app : le job iOS ne reçoit pas le certificat Mac, ni l'inverse. Absents,
      # ils valent '' et le script garde le mode non signé. Le job chrome n'en reçoit aucun.
      - name: Construire l'app
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ matrix.app == 'mac' && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ matrix.app == 'mac' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
          NOTARY_API_KEY_ID: ${{ matrix.app == 'mac' && secrets.NOTARY_API_KEY_ID || '' }}
          NOTARY_API_ISSUER_ID: ${{ matrix.app == 'mac' && secrets.NOTARY_API_ISSUER_ID || '' }}
          NOTARY_API_KEY_P8_BASE64: ${{ matrix.app == 'mac' && secrets.NOTARY_API_KEY_P8_BASE64 || '' }}
          IOS_SIGNING_P12_BASE64: ${{ matrix.app == 'ios' && secrets.IOS_SIGNING_P12_BASE64 || '' }}
          IOS_SIGNING_P12_PASSWORD: ${{ matrix.app == 'ios' && secrets.IOS_SIGNING_P12_PASSWORD || '' }}
          IOS_PROFILE_APP_BASE64: ${{ matrix.app == 'ios' && secrets.IOS_PROFILE_APP_BASE64 || '' }}
          IOS_PROFILE_WIDGETS_BASE64: ${{ matrix.app == 'ios' && secrets.IOS_PROFILE_WIDGETS_BASE64 || '' }}
          IOS_TEAM_ID: ${{ matrix.app == 'ios' && secrets.IOS_TEAM_ID || '' }}
          # Variable de dépôt, pas un secret : ad-hoc (défaut) ou development.
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: bash scripts/release-assets.sh ${{ matrix.app }}
      # Le trousseau temporaire et les profils installés partent même après un échec
      # ou une annulation ; le script les retire déjà en sortie, cette étape couvre
      # l'arrêt brutal.
      - name: Nettoyer la signature
        if: always()
        run: bash scripts/release-assets.sh nettoyer
      # --clobber : un rejeu remplace les fichiers déjà joints au lieu d'échouer.
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" omp-console/build/release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
