name: check

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : aucun job n'écrit avec le GITHUB_TOKEN (ni commentaire, ni
# statut, ni push). Le cache et l'artefact de l'app Mac passent par le jeton
# d'exécution d'Actions, que ce bloc ne restreint pas.
permissions:
  contents: read

# Version de l'hôte OMP installé par les jobs `check` et `macos-tests`, source
# unique : elle entre aussi dans la clé du cache npm. Ce bloc précède
# `concurrency` : les gardes de ce dernier lisent tout ce qui le suit jusqu'à
# `jobs:`. 18.8.4 : les options du service (`bindProcessState` de
# CreateAgentSessionOptions, `runEphemeralTurn` de ExtensionContextActions)
# n'existent pas dans 18.2.11, et 18.4.8 livre des sources que Bun ne charge pas
# (`createRatchetPrelude` absent de `src/ratchet/prelude.js`), ce qui ferait
# échouer la section « Plugins réels ». Mesuré : 18.8.4 passe le type-check ET le
# smoke.
env:
  OMP_HOST_VERSION: "18.8.4"
  OMP_HOST_TYPES_NODE: "22"

# Un nouveau commit sur une PR annule le run en cours de cette PR : seul le sha le
# plus récent décide, et le run annulé libère ses runners macOS (4 par run, sur
# une limite de 5 par compte). Au push vers `main`, le groupe porte l'identifiant
# du run, unique : il ne contient jamais qu'un run, donc rien n'y est annulé ni
# remplacé en attente — un run de `main` va toujours au bout. Le préfixe `check-`
# évite tout partage de groupe avec `release-simulation-<n>` : un groupe partagé
# entre workflows annulerait aussi les runs de l'autre.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job ubuntu complet : toutes les sections et toute la suite node, à chaque run.
  # La matrice d'un seul OS est gardée pour le nom du statut requis,
  # `check (ubuntu-latest)`. Il reste le PREMIER job du fichier (test/outillage/smoke.test.ts
  # y lit la matrice) et ne dépend d'aucun job.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Plafond ≈ 4× le plus long run mesuré (médiane 385 s, max 458 s sur les 40
    # derniers runs, 2026-10-24) : un job bloqué rend son runner au lieu d'attendre
    # les 6 h par défaut.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # La garde anti-bump manuel compare la base et la tête de la PR : sans
          # l'historique complet, `git merge-base` ne trouve pas la base.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Empreinte des toolchains de l'image (Node, rustc, Swift/Xcode) : elle entre
      # dans chaque clé de cache, pour qu'une mise à jour de l'image change la clé
      # au lieu de restaurer des artefacts compilés par un autre compilateur. Un
      # outil absent donne « absent », haché : la clé reste valide.
      - name: Empreinte des toolchains (clés de cache)
        id: toolchain
        run: |
          {
            echo "node=$(node --version 2>/dev/null || echo absent)"
            echo "rust=$( (rustc -vV 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
            echo "swift=$( (swift --version 2>&1 || echo absent; xcode-select -p 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      # Le cache de contenu de npm (~/.npm), jamais node_modules : `npm install`
      # est toujours rejoué et revérifie l'arbre, seul le téléchargement est évité.
      - name: Cache npm (hôte OMP)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node }}-omp-${{ env.OMP_HOST_VERSION }}-types-node-${{ env.OMP_HOST_TYPES_NODE }}
      # Registre cargo et cible de mem0-rs. Ni ~/.cargo/bin (proxies rustup de
      # l'image : les restaurer épinglerait une toolchain périmée) ni
      # registry/src (régénéré). Pas de restore-keys : une clé changée repart de
      # zéro, et cargo recompile toujours ce que les sources fraîches invalident.
      - name: Cache cargo (mem0-rs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            mem0-stack/mem0-rs/target
          key: cargo-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('mem0-stack/mem0-rs/Cargo.lock', 'mem0-stack/mem0-rs/Cargo.toml') }}
      # Une ÉTAPE des jobs `check` et `macos-tests`, jamais un job séparé : les
      # statuts requis de `main` sont `check (ubuntu-latest)` et l'agrégateur
      # `check (macos-latest)`, donc un job nouveau ne bloquerait rien. Le bump
      # appartient au job de release ; une PR qui monte une version à la main
      # échoue ici.
      - name: Refuser un bump de version manuel dans la PR
        if: github.event_name == 'pull_request'
        run: ./scripts/no-manual-bump.sh --base "${{ github.event.pull_request.base.sha }}"
      - name: Installer l'hôte OMP (types et SDK)
        run: |
          # Version épinglée par l'`env:` du workflow (justification là-haut).
          npm install --no-save --prefix "$RUNNER_TEMP/omp-host" "@oh-my-pi/pi-coding-agent@$OMP_HOST_VERSION" "@types/node@$OMP_HOST_TYPES_NODE"
          echo "MEM0_OMP_HOST_TYPES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
          echo "MEM0_OMP_HOST_MODULES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
      - name: Installer le TypeScript épinglé du type-check
        run: bash scripts/typecheck.sh --prepare
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Préparer le linter épinglé (Biome)
        run: bash scripts/lint.sh --prepare
      # Qdrant natif téléchargé hors du dépôt : la source des tests de
      # `mem0-rs import` (section `rust`).
      - name: Préparer la Qdrant source des tests d'import mem0-rs
        run: bash scripts/mem0-http-contrat.sh --prepare
      - name: Préparer la toolchain Rust (clippy)
        run: rustup component add clippy
      - name: Valider le catalogue, le manifeste et l'extension
        env:
          # En CI, un prérequis manquant (bun, hôte, cargo ou clippy) est un échec,
          # jamais un skip : ni le harnais « plugins réels », ni la section Rust ne
          # doivent pouvoir disparaître en silence. `--strict` étend la règle aux
          # tests de test/ sautés faute de prérequis installable (prerequisAbsent).
          MEM0_OMP_REQUIRE_SMOKE: "1"
          MEM0_OMP_REQUIRE_RUST: "1"
        # En pull_request, `── Tests` ne lance que les fichiers que le diff de la
        # PR concerne (`--tests-base`, scripts/test-files.sh) : la base de la PR
        # est connue grâce à fetch-depth: 0. Au push vers `main`, l'option est
        # vide et la suite entière tourne : c'est le filet des trous de sélection.
        run: ./scripts/check.sh --strict ${{ github.event_name == 'pull_request' && format('--tests-base={0}', github.event.pull_request.base.sha) || '' }}

  # Le contrôle macOS est éclaté en jobs PARALLÈLES sur des runners distincts : en
  # un seul job, il durait ≈ 36 min, au-delà des 2100 s d'attente de fusion que
  # release.yml accorde à scripts/release.ts (`--merge-timeout 2100`). Aucun de
  # ces jobs n'a de `needs` — ils démarrent ensemble. Leur seul `if:` est
  # `github.event_name == 'pull_request'`, toujours vrai pour l'événement qui
  # porte les statuts requis : un job ne peut pas être sauté sur une PR. Au push
  # vers `main`, ils ne tournent pas (mesuré le 2026-10-22 : 16 jobs macOS par
  # feature pour 5 runners, dont 8 au push qui reprouvaient l'arbre que la PR de
  # release venait de prouver). L'union de leurs `--sections` couvre
  # les 13 sections de check.sh : rien de ce que le job macOS vérifiait ne disparaît.
  #
  # Les deux jobs d'app ne compilent que si le diff de la PR peut avoir changé
  # l'app (scripts/ci-scope.sh : omp-console/, scripts/, mem0-stack/, ce
  # fichier). La décision tient au diff, jamais au nom de la branche : un fork
  # choisit sa branche, pas son diff. Le job reste vert quand l'étape est sautée,
  # avec une ligne qui le dit : il n'y a rien à prouver pour ce diff.

  # Compilation, tests et bundle de l'app Swift : swift seul, aucune préparation
  # hormis la restauration du cache cargo (le mem0-rs embarqué). Aucun cache
  # SwiftPM : mesuré le 2026-10-22, un `.build-app` restauré (« Cache hit ») ne
  # dispensait d'aucune des 136 unités (« Build complete! (390.39 sec) »), les
  # mtimes du checkout invalidant tout, et la clé (Package.swift seul) n'était
  # jamais resauvegardée.
  macos-app-swift:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    # Médiane 258 s, max 578 s (2026-10-24). 30 min tiennent sous l'attente de fusion
    # que release.yml accorde à release.ts (`--merge-timeout 2100`).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # La portée du diff compare la base et la tête de la PR.
          fetch-depth: 0
      # Empreinte des toolchains de l'image (Node, rustc, Swift/Xcode) : elle entre
      # dans chaque clé de cache, pour qu'une mise à jour de l'image change la clé
      # au lieu de restaurer des artefacts compilés par un autre compilateur. Un
      # outil absent donne « absent », haché : la clé reste valide.
      - name: Empreinte des toolchains (clés de cache)
        id: toolchain
        run: |
          {
            echo "node=$(node --version 2>/dev/null || echo absent)"
            echo "rust=$( (rustc -vV 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
            echo "swift=$( (swift --version 2>&1 || echo absent; xcode-select -p 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      # Registre cargo et cible de mem0-rs. Ni ~/.cargo/bin (proxies rustup de
      # l'image : les restaurer épinglerait une toolchain périmée) ni
      # registry/src (régénéré). Pas de restore-keys : une clé changée repart de
      # zéro, et cargo recompile toujours ce que les sources fraîches invalident.
      # Ici, la cible release de `cargo build --release` (scripts/swift-app.sh).
      - name: Cache cargo (mem0-rs)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            mem0-stack/mem0-rs/target
          key: cargo-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('mem0-stack/mem0-rs/Cargo.lock', 'mem0-stack/mem0-rs/Cargo.toml') }}
      # Le diff de la PR touche-t-il l'app Mac ? Sinon les trois étapes qui
      # suivent sont sautées (`steps.scope.outputs.run`), et le job le dit.
      - name: Portée du diff (app Swift)
        id: scope
        run: |
          if bash scripts/ci-scope.sh --base="${{ github.event.pull_request.base.sha }}" app-swift; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::App Swift non recompilée : rien du diff ne touche omp-console/, scripts/, mem0-stack/ ni check.yml"
          fi
      - name: App Swift
        if: steps.scope.outputs.run == '1'
        run: ./scripts/check.sh --sections=app-swift
      # Le bundle assemblé, téléchargeable depuis le run (onglet Summary) pour essayer
      # une PR sans la compiler. `ditto` garde les droits d'exécution et la signature
      # ad hoc, que l'archive d'upload-artifact perdrait.
      - name: Archiver l'app Mac
        if: steps.scope.outputs.run == '1'
        run: ditto -c -k --keepParent "omp-console/build/OMP Console.app" "omp-console/build/OMP-Console-macOS.zip"
      - name: Publier l'app Mac (artefact du run)
        if: steps.scope.outputs.run == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OMP-Console-macOS
          path: omp-console/build/OMP-Console-macOS.zip
          retention-days: 14
          if-no-files-found: error

  # Compilation et tests de l'app iOS : Xcode seul, aucune préparation.
  macos-app-ios:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    # Médiane 186 s, max 688 s (2026-10-24) : même plafond que macos-app-swift.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # La portée du diff compare la base et la tête de la PR.
          fetch-depth: 0
      # Aucun cache ici, c'est un choix mesuré (ci-without-cache) : un DerivedData
      # `omp-console/.build-ios` restauré ne fait rien gagner. xcodebuild recompile
      # tout, car les mtimes du checkout l'invalident, et ~235 s vont au démarrage
      # des tests sur simulateur.
      - name: Portée du diff (app iOS)
        id: scope
        run: |
          if bash scripts/ci-scope.sh --base="${{ github.event.pull_request.base.sha }}" app-ios; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "::notice::App iOS non recompilée : rien du diff ne touche omp-console/, scripts/ ni check.yml"
          fi
      - name: App iOS
        if: steps.scope.outputs.run == '1'
        env:
          # Xcode est utilisable sur macos-latest : un « non exécuté » de la
          # section iOS y est un échec, jamais un skip silencieux.
          MEM0_OMP_REQUIRE_IOS: "1"
        run: ./scripts/check.sh --sections=app-ios

  # Suite node sur macOS, en deux parts qui exécutent chaque test exactement une
  # fois (motif unique TESTS_PART_PATTERN de check.sh) : 1/2 porte les tests lourds
  # de test/outillage/check.test.ts et les sections légères, 2/2 tout le reste.
  # `--tests-scope=macos` ne garde que les fichiers qui dépendent de macOS
  # (scripts/test-files.sh) et `--tests-base` les réduit à ceux que le diff de la
  # PR concerne : la suite complète tourne sur ubuntu, et un diff qui ne touche
  # ni omp-console/ ni un script macOS ne lance rien ici.
  macos-tests:
    # Nom explicite : sans lui, le nom affiché listerait aussi `sections`, ajouté
    # par `include` ; seul `part` distingue les deux jobs.
    name: macos-tests (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: ["1/2", "2/2"]
        include:
          - part: "1/2"
            sections: catalogue,noms,plugins,versions,extension,types,lint,rust,smoke,tests,noyau
          - part: "2/2"
            sections: tests
    runs-on: macos-latest
    if: github.event_name == 'pull_request'
    # Médiane 251 s, max 565 s par partie (2026-10-24) : même plafond.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # La garde anti-bump manuel compare la base et la tête de la PR : sans
          # l'historique complet, `git merge-base` ne trouve pas la base.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Empreinte des toolchains de l'image (Node, rustc, Swift/Xcode) : elle entre
      # dans chaque clé de cache, pour qu'une mise à jour de l'image change la clé
      # au lieu de restaurer des artefacts compilés par un autre compilateur. Un
      # outil absent donne « absent », haché : la clé reste valide.
      - name: Empreinte des toolchains (clés de cache)
        id: toolchain
        run: |
          {
            echo "node=$(node --version 2>/dev/null || echo absent)"
            echo "rust=$( (rustc -vV 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
            echo "swift=$( (swift --version 2>&1 || echo absent; xcode-select -p 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      # Le cache de contenu de npm (~/.npm), jamais node_modules : `npm install`
      # est toujours rejoué et revérifie l'arbre, seul le téléchargement est évité.
      - name: Cache npm (hôte OMP)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node }}-omp-${{ env.OMP_HOST_VERSION }}-types-node-${{ env.OMP_HOST_TYPES_NODE }}
      # Registre cargo et cible de mem0-rs. Ni ~/.cargo/bin (proxies rustup de
      # l'image : les restaurer épinglerait une toolchain périmée) ni
      # registry/src (régénéré). Pas de restore-keys : une clé changée repart de
      # zéro, et cargo recompile toujours ce que les sources fraîches invalident.
      # Seule la partie 1/2 compile mem0-rs (section rust) ; la 2/2 n'y touche
      # que si le diff retient un test de test/stack/*, rare.
      - name: Cache cargo (mem0-rs)
        if: matrix.part == '1/2'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            mem0-stack/mem0-rs/target
          key: cargo-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('mem0-stack/mem0-rs/Cargo.lock', 'mem0-stack/mem0-rs/Cargo.toml') }}
      # Aucun cache SwiftPM pour `.build-node` (socle-app-swift/AC-1) : même
      # constat que pour `.build-app` du job macos-app-swift.
      - name: Refuser un bump de version manuel dans la PR
        run: ./scripts/no-manual-bump.sh --base "${{ github.event.pull_request.base.sha }}"
      - name: Installer l'hôte OMP (types et SDK)
        run: |
          # Même hôte que le job `check` (`env:` du workflow).
          npm install --no-save --prefix "$RUNNER_TEMP/omp-host" "@oh-my-pi/pi-coding-agent@$OMP_HOST_VERSION" "@types/node@$OMP_HOST_TYPES_NODE"
          echo "MEM0_OMP_HOST_TYPES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
          echo "MEM0_OMP_HOST_MODULES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
      - name: Installer le TypeScript épinglé du type-check
        run: bash scripts/typecheck.sh --prepare
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Préparer le linter épinglé (Biome)
        run: bash scripts/lint.sh --prepare
      - name: Préparer la Qdrant source des tests d'import mem0-rs
        run: bash scripts/mem0-http-contrat.sh --prepare
      - name: Préparer la toolchain Rust (clippy)
        run: rustup component add clippy
      - name: Valider le catalogue, le manifeste et l'extension (${{ matrix.part }})
        env:
          # Prérequis manquant = échec, jamais un skip (voir le job `check`).
          MEM0_OMP_REQUIRE_SMOKE: "1"
          MEM0_OMP_REQUIRE_RUST: "1"
        run: ./scripts/check.sh --sections=${{ matrix.sections }} --tests-part=${{ matrix.part }} --tests-scope=macos --tests-base=${{ github.event.pull_request.base.sha }}

  # Agrégateur : son nom est le statut requis `check (macos-latest)` de la
  # protection de `main` (PUBLISHING.md § Blocage du merge). `always()` le fait
  # tourner même quand un job macOS échoue ou que le run est annulé : sans lui, il
  # serait « skipped », et un statut requis sauté compte comme passant. Comme les
  # jobs qu'il juge, il ne tourne qu'en pull_request. Le verdict est rendu par
  # scripts/ci-verdict.sh, qui n'accepte que trois `success`.
  check-macos:
    name: check (macos-latest)
    runs-on: ubuntu-latest
    needs: [macos-app-swift, macos-app-ios, macos-tests]
    if: ${{ always() && github.event_name == 'pull_request' }}
    # Quelques secondes mesurées : ce job ne fait que lire trois résultats.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verdict des jobs macOS
        run: bash scripts/ci-verdict.sh macos-app-swift=${{ needs.macos-app-swift.result }} macos-app-ios=${{ needs.macos-app-ios.result }} macos-tests=${{ needs.macos-tests.result }}
