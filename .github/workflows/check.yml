name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # La garde anti-bump manuel compare la base et la tête de la PR : sans
          # l'historique complet, `git merge-base` ne trouve pas la base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Une ÉTAPE du job `check` existant, jamais un job séparé : les deux seuls
      # statuts requis de `main` sont les deux déclinaisons de ce job, donc un job
      # nouveau ne bloquerait rien. Le bump appartient au job de release ; une PR
      # qui monte une version à la main échoue ici.
      - name: Refuser un bump de version manuel dans la PR
        if: github.event_name == 'pull_request'
        run: ./scripts/no-manual-bump.sh --base "${{ github.event.pull_request.base.sha }}"
      - name: Installer l'hôte OMP (types et SDK)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/omp-host" @oh-my-pi/pi-coding-agent@18.2.11 @types/node@22
          echo "MEM0_OMP_HOST_TYPES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
          echo "MEM0_OMP_HOST_MODULES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Valider le catalogue, le manifeste et l'extension
        env:
          # En CI, un prérequis manquant (bun, hôte) est un échec, jamais un skip :
          # le harnais « plugins réels » ne doit pas pouvoir disparaître en silence.
          MEM0_OMP_REQUIRE_SMOKE: "1"
        run: ./scripts/check.sh
