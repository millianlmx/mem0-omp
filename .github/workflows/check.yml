name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # La garde anti-bump manuel compare la base et la tête de la PR : sans
          # l'historique complet, `git merge-base` ne trouve pas la base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Une ÉTAPE du job `check` existant, jamais un job séparé : les deux seuls
      # statuts requis de `main` sont les deux déclinaisons de ce job, donc un job
      # nouveau ne bloquerait rien. Le bump appartient au job de release ; une PR
      # qui monte une version à la main échoue ici.
      - name: Refuser un bump de version manuel dans la PR
        if: github.event_name == 'pull_request'
        run: ./scripts/no-manual-bump.sh --base "${{ github.event.pull_request.base.sha }}"
      - name: Installer l'hôte OMP (types et SDK)
        run: |
          # 18.8.4 : les options du service (`bindProcessState` de
          # CreateAgentSessionOptions, `runEphemeralTurn` de ExtensionContextActions)
          # n'existent pas dans 18.2.11, et 18.4.8 livre des sources que Bun ne
          # charge pas (`createRatchetPrelude` absent de `src/ratchet/prelude.js`),
          # ce qui ferait échouer la section « Plugins réels ». Mesuré : 18.8.4
          # passe le type-check ET le smoke.
          npm install --no-save --prefix "$RUNNER_TEMP/omp-host" @oh-my-pi/pi-coding-agent@18.8.4 @types/node@22
          echo "MEM0_OMP_HOST_TYPES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
          echo "MEM0_OMP_HOST_MODULES=$RUNNER_TEMP/omp-host/node_modules" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # Le test d'API mem0-http tourne HORS du build d'image : la version de
      # Python est celle du `FROM python:…` du Dockerfile, jamais un chiffre écrit
      # ici, et `actions/setup-python` la sert depuis le tool cache du runner
      # (3.11.16 sur ubuntu-latest, 3.11.9 sur macos-latest) — aucun téléchargement.
      - id: image_python
        run: echo "version=$(bash scripts/mem0-http-test.sh --python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.image_python.outputs.version }}
      # Les exigences viennent de la déclaration du Dockerfile (celle-là même que
      # l'image installe) : une montée de plage change ce qui est testé, sans
      # seconde liste à maintenir. Le venv vit hors du dépôt.
      - name: Préparer l'environnement du test d'API mem0-http
        run: bash scripts/mem0-http-test.sh --prepare
      - name: Valider le catalogue, le manifeste et l'extension
        env:
          # En CI, un prérequis manquant (bun, hôte, environnement du test d'API)
          # est un échec, jamais un skip : ni le harnais « plugins réels » ni le
          # test d'API mem0-http ne doivent pouvoir disparaître en silence.
          MEM0_OMP_REQUIRE_SMOKE: "1"
          MEM0_OMP_REQUIRE_HTTP_API: "1"
          # Sur macos-latest, Xcode est utilisable : un « non exécuté » de la
          # section iOS y est un échec, jamais un skip silencieux. Ailleurs (Ubuntu),
          # la variable est vide et la section annonce simplement son absence.
          MEM0_OMP_REQUIRE_IOS: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: ./scripts/check.sh
