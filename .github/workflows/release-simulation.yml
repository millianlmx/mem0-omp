name: release-simulation

# Simule, sur une copie jetable, la release qu'entraînerait la fusion de cette PR
# (« plan de scripts/release.ts → écriture des versions, des deux catalogues et du
# CHANGELOG.md → check.sh sur l'arbre écrit »), et l'expose comme statut requis
# DÉDIÉ. Rien n'est poussé, aucun tag n'est posé, aucune PR n'est ouverte.
#
# `pull_request` sans `types:` : les types par défaut (`opened`, `synchronize`,
# `reopened`) couvrent toute PR vers `main`. Le checkout par défaut fournit l'état
# FUSIONNÉ (`GITHUB_REF = refs/pull/<n>/merge`) : la fusion n'est jamais
# refabriquée par un script. Pas de `paths:` non plus : un filtre de chemins
# laisserait le statut « Pending » et bloquerait le merge à tort.
on:
  pull_request:
    branches: [main]

# Le job ne fait que LIRE (le plan lit `origin/main` et les tags distants) : aucun
# jeton d'écriture, aucun secret. Une PR de fork, dont le jeton est en lecture
# seule, tourne donc à l'identique.
permissions:
  contents: read

# Un push sur la PR annule le run précédent : seul le sha le plus récent décide.
# Un run `cancelled` ne satisfait pas un statut requis, donc le statut reste
# porté par le run du dernier sha — celui qui compte pour la fusion.
concurrency:
  group: "release-simulation-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  # Job SANS matrice et SANS `name:` : le contexte du statut est exactement
  # l'identifiant du job, `release-simulation` (c'est ce nom que déclare la
  # protection de branche, PUBLISHING.md § Blocage du merge). AUCUN `if:` : un job
  # sauté rapporte « Success » et ne prouverait rien.
  release-simulation:
    runs-on: ubuntu-latest
    # Une copie du dépôt, une écriture, puis `check.sh` complet.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `historyOfPlugin` parcourt l'historique de chaque `package.json` et la
          # garde d'idempotence lit `origin/main` : sans l'historique complet, le
          # plan est faux.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # L'ENVIRONNEMENT DU JOB DE RELEASE, pas celui de `check.yml` : ni Bun, ni
          # hôte OMP, ni `MEM0_OMP_REQUIRE_SMOKE`. Le verdict doit être celui de la
          # release, jamais celui d'un gate plus strict.
          node-version: "22"
      # Empreinte des toolchains de l'image : elle entre dans la clé du cache cargo,
      # pour qu'une mise à jour de rustc change la clé (même étape que check.yml).
      - name: Empreinte des toolchains (clés de cache)
        id: toolchain
        run: |
          {
            echo "node=$(node --version 2>/dev/null || echo absent)"
            echo "rust=$( (rustc -vV 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
            echo "swift=$( (swift --version 2>&1 || echo absent; xcode-select -p 2>&1 || echo absent) | shasum -a 256 | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      # Registre cargo et cible STABLE de mem0-rs : la copie jetable du script vit
      # sous un chemin mktemp qui change à chaque run, donc sa cible par défaut ne
      # serait jamais restaurée. Ni ~/.cargo/bin (proxies rustup de l'image) ni
      # registry/src (régénéré) ; pas de restore-keys. Le cache n'est sauvegardé
      # que par un job vert.
      - name: Cache cargo (mem0-rs)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cargo-target
          key: cargo-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-rustc-${{ steps.toolchain.outputs.rust }}-${{ hashFiles('mem0-stack/mem0-rs/Cargo.lock', 'mem0-stack/mem0-rs/Cargo.toml') }}
      # Le linter épinglé est préparé à la racine du clone : la section `lint` du
      # check.sh de la copie le trouve par MEM0_OMP_LINT_DIR, que le script exporte.
      - name: Préparer le linter épinglé (Biome)
        run: bash scripts/lint.sh --prepare
      - name: Installer le TypeScript épinglé du type-check
        run: bash scripts/typecheck.sh --prepare
      # Aucun secret : le script crée lui-même la copie jetable, y rejoue
      # `scripts/release.ts --simulate` et rend son verdict. Seule variable :
      # CARGO_TARGET_DIR, la cible cachée ci-dessus, que check.sh, swift-app.sh et
      # les tests test/stack/* honorent déjà. Posée sur l'étape : le contexte
      # `runner` n'est pas disponible dans `jobs.<id>.env`.
      - name: Simuler la release sur une copie jetable
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: bash scripts/release-simulation.sh
