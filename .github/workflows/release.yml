name: release

# Un merge sur main (merge commit, squash ou rebase : les trois poussent sur main)
# déclenche le moteur de release (job `release`) : il décide des versions, écrit
# versions, catalogues et CHANGELOG.md, prouve l'arbre écrit avec check.sh, puis
# pousse le commit de release DIRECTEMENT sur main — avance rapide seulement,
# jamais forcée — avec le jeton dédié, autorisé à contourner la protection de
# branche (PUBLISHING.md § Jeton de release). Ce commit porte `[skip ci]` : il ne
# relance ni check.yml ni ce workflow. Si main a bougé entre le plan et la
# poussée (une autre PR fusionnée), le moteur recalcule la release depuis le
# nouveau main et retente. Viennent ensuite les tags et les releases GitHub, puis
# la branche `deploy` (avance rapide seulement) sur le commit du dernier tag
# omp-harness-v* : la pile Portainer la suit en GitOps (omp-harness/README.md
# § Avec Portainer).
#
# Le job `assets` construit enfin les apps des releases publiées
# (release-assets.yml, réutilisable), une fois par commit tagué : les tags d'un
# même run pointent tous sur le commit de release.
#
# `workflow_dispatch` relance la release à la main, sur `main` seulement : un run
# sauté (message de squash qui cite la marque skip ci entre crochets) ou perdu se
# rattrape sans attendre la fusion suivante. Le plan part toujours de la version
# publiée de chaque plugin, donc la relance publie tout ce qui attend.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Le job de release écrit avec le jeton dédié (secret RELEASE_TOKEN), y compris le
# checkout ; le GITHUB_TOKEN reste en lecture. Seul l'appel des assets l'élargit,
# pour `gh release upload`.
permissions:
  contents: read

# Deux merges rapprochés ne doivent pas se marcher dessus : le second attend le
# premier (le moteur relit origin/main et repart de son état). `queue: max` :
# jusqu'à 100 runs en attente (FIFO) — avec le défaut `single`, un merge
# intermédiaire perdrait silencieusement son run et sa publication n'aurait
# jamais lieu tant qu'aucun merge ne suit. La file ne suffit pas seule : un merge
# peut arriver entre le plan d'un run et sa poussée, d'où le recalcul du moteur
# quand main bouge sous lui.
concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

jobs:
  release:
    # Un lancement manuel depuis une autre branche ne publie rien : le commit de
    # l'événement doit être celui de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Plan, écriture, check.sh limité aux sections que la release peut casser,
    # poussée, tags et releases : quelques minutes ; chaque recalcul (main a
    # bougé) rejoue check.sh, trois au plus.
    timeout-minutes: 30
    outputs:
      # JSON `[{ref, tags}]` écrit par le moteur de release : un groupe par commit
      # tagué, vide quand rien n'est publié.
      assets: ${{ steps.publier.outputs.assets }}
    steps:
      # Première étape, avant tout checkout : sans le jeton dédié, rien ne peut
      # être publié — le GITHUB_TOKEN ne contourne pas la protection de main.
      # Échouer ici évite un run à moitié fait, et il n'y a AUCUN repli sur le
      # jeton du dépôt : le secret ci-dessous est la seule identité de
      # publication (cf. PUBLISHING.md, § Jeton de release).
      - name: Vérifier le jeton de release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::secret RELEASE_TOKEN absent — le job de release ne peut pas publier. Crée-le (PUBLISHING.md, § Jeton de release), puis relance cette exécution."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `token` : l'identité DÉDIÉE, celle qui pousse le commit de release, les
          # tags et la branche `deploy`.
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # fetch-depth: 0 ne garantit pas les tags : on les demande explicitement,
      # avec l'état de main, avant que le moteur ne lise origin/main.
      - name: Récupérer les tags et l'état de main
        run: git fetch --force --tags origin "+refs/heads/main:refs/remotes/origin/main"
      # Le moteur écrit, prouve avec check.sh, committe, pousse sur main, tague et
      # publie. Ses seules étapes préalables : préparer le linter et le TypeScript
      # épinglés, que les sections `lint` et `types` de check.sh exigent sans
      # jamais les télécharger elles-mêmes.
      - name: Préparer le linter épinglé (Biome)
        run: bash scripts/lint.sh --prepare
      - name: Installer le TypeScript épinglé du type-check
        run: bash scripts/typecheck.sh --prepare
      # La plage de l'événement : celle du push, ou, lancé à la main, le commit
      # de main et son parent. Les valeurs passent par l'environnement, jamais
      # interpolées dans le shell.
      - name: Plage de l'événement
        id: plage
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
        run: |
          if [ -z "$BEFORE" ]; then
            BEFORE="$(git rev-parse "$AFTER^")"
            echo "· lancement manuel : plage $BEFORE..$AFTER"
          fi
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
      - name: Décider, écrire, prouver et publier
        id: publier
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BEFORE: ${{ steps.plage.outputs.before }}
          AFTER: ${{ steps.plage.outputs.after }}
        run: |
          node --experimental-strip-types scripts/release.ts \
            --before "$BEFORE" \
            --after "$AFTER"

  # Les apps des releases publiées : Mac, iOS et l'extension Chrome, construites
  # une fois par commit tagué et jointes à chacune de ses releases. Sauté quand
  # le run n'a rien publié.
  assets:
    needs: release
    if: needs.release.outputs.assets != '' && needs.release.outputs.assets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.assets) }}
    # `gh release upload` exige contents: write ; les secrets de signature vont,
    # dans release-assets.yml, au seul job de leur app.
    permissions:
      contents: write
    uses: ./.github/workflows/release-assets.yml
    with:
      ref: ${{ matrix.ref }}
      tags: ${{ matrix.tags }}
    secrets: inherit
